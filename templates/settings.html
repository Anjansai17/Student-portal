{% extends "base.html" %}

{% block content %}

<h1>Settings</h1>

<div class="box">

    <h2>Account Settings</h2>

    <table class="table">

        <tr>
            <th>Username</th>
            <td>{{ session['username'] }}</td>
        </tr>

        <tr>
            <th>Email</th>
            <td>student@gmail.com</td>
        </tr>

        <tr>
            <th>Password</th>
            <td>
                <button class="action-btn">
                    Change Password
                </button>
            </td>
        </tr>

        <tr>
            <th>Theme</th>
            <td>
                <button class="action-btn">
                    Dark Mode
                </button>
            </td>
        </tr>

        <tr>
            <th>Language</th>
            <td>
                <select class="form-control">
                    <option>English</option>
                    <option>Telugu</option>
                    <option>Hindi</option>
                </select>
            </td>
        </tr>

    </table>

</div>

<br>

<div class="box">

    <h2>About Portal</h2>

    <p><b>Portal Name:</b> Smart College ERP</p>
    <p><b>Version:</b> 1.0</p>
    <p><b>Developer:</b> Anjan Sai Chowdary</p>

</div>

{% endblock %}
